name: Download, validate and publish ASI Atlas
on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "35 3 1 * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all 42 real published tables
        run: python scripts/sync_data.py
      - name: Verify completeness before publishing
        run: python scripts/verify_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
