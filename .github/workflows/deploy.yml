name: Download, validate and publish ASI Atlas
on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "35 3 1 * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all 42 real published tables
        run: python scripts/sync_data.py
      - name: Verify completeness before publishing
        run: python scripts/verify_data.py
      - name: Check dashboard JavaScript syntax
        run: node --check assets/app.js
      - name: Print representative real dataset keys for schema check
        run: |
          python - <<'PY'
          import json
          for file in ['asi-nic2','asi-nic3','asi-nic4','asi-state-nic2-maharashtra','asi-states-all']:
              d=json.load(open('data/'+file+'.json'))
              print(file, 'example keys:', list(d['series'])[:4])
              print('example entry:', next(iter(d['series'].values()))['label'],next(iter(d['series'].values()))['unit'])
          PY
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Smoke test the real, populated dashboard in Chromium
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/atlas-server.log 2>&1 &
          node tests/smoke.mjs
      - name: Save browser screenshot if checks fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-browser-test-screenshot
          path: smoke-screenshot.png
          if-no-files-found: ignore
      - name: Preserve complete validated website as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: industry-atlas-verified-full-site
          path: |
            index.html
            assets/
            data/
            scripts/
            README.md
          retention-days: 30
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
